<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body style="margin:0">
<title>Omex Hospitality Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: slim demo bar on top; below it either the staff phone app (full width on phones, framed on desktop) or the owner/GM dashboard (cards in a responsive grid). Atkinson Hyperlegible was designed for low-vision readers, which suits staff with limited reading. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f2f5f4; --line:#d6dedb; --fg:#14201c; --muted:#56655f;
  --accent:#0b6b55; --accent-ink:#ffffff; --accent-soft:#d9efe8;
  --out:#c2412b; --out-soft:#fae3dd; --warn:#9a6200; --warn-soft:#f9ecd2; --info:#245d96; --info-soft:#e0ebf7;
  --gold:#8a6a00; --gold-soft:#f6edcc;
  --frame:#101614;
  --read:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Space Grotesk","Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1311; --surface:#161e1b; --surface-2:#1d2724; --line:#2b3833; --fg:#e8efec; --muted:#9cab a4; --muted:#9cab a4;
  --muted:#9eada6; --accent:#3cbb98; --accent-ink:#04241b; --accent-soft:#163b31;
  --out:#f0806a; --out-soft:#3e211b; --warn:#e5b257; --warn-soft:#3a2d12; --info:#86b6ea; --info-soft:#18293b;
  --gold:#e2c25a; --gold-soft:#352d10; --frame:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#161e1b; --surface-2:#1d2724; --line:#2b3833; --fg:#e8efec;
  --muted:#9eada6; --accent:#3cbb98; --accent-ink:#04241b; --accent-soft:#163b31;
  --out:#f0806a; --out-soft:#3e211b; --warn:#e5b257; --warn-soft:#3a2d12; --info:#86b6ea; --info-soft:#18293b;
  --gold:#e2c25a; --gold-soft:#352d10; --frame:#000; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--read);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none}

/* demo bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--frame)}
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--frame);color:#e9f1ee;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.demobar .tag{background:#2c6e5c;color:#fff;border-radius:6px;padding:2px 7px;font-weight:700;font-size:11px;letter-spacing:.06em}
.demobar select{background:#1f2a26;color:#e9f1ee;border:1px solid #3a4a44;border-radius:8px;padding:6px 8px;font-size:14px;max-width:100%}
.demobar button{background:#1f2a26;color:#e9f1ee;border:1px solid #3a4a44;border-radius:8px;padding:6px 10px;font-size:13px}
.demobar .grow{flex:1}
.sim{background:var(--frame);color:#e9f1ee;padding-block:8px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px;font-size:13px;border-top:1px solid #26332e}
.sim b{width:100%;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9fb5ad}
.sim button{background:#1f2a26;color:#e9f1ee;border:1px solid #3a4a44;border-radius:999px;padding:6px 11px}
.sim button[aria-pressed="true"]{background:#2c6e5c;border-color:#3cbb98}

/* staff phone */
.stage{display:flex;justify-content:center;padding-block:0}
.phone{width:100%;max-width:440px;background:var(--surface);min-height:calc(100vh - 48px);display:flex;flex-direction:column;position:relative}
@media (min-width:760px){
  .stage{padding-block:24px 40px;gap:32px;align-items:flex-start}
  .phone{border:12px solid var(--frame);border-radius:44px;min-height:0;height:820px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .aside{display:block!important}
}
.aside{display:none;max-width:320px;color:var(--muted);font-size:14px}
.aside h2{font-family:var(--display);color:var(--fg);font-size:20px;margin:0 0 8px}
.aside ul{padding-left:18px;margin:0;display:grid;gap:6px}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;flex:none}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:17px}
.top .who span{color:var(--muted);font-size:14px}
.speak{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:22px;color:var(--accent)}
.body{flex:1;overflow-y:auto;padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);padding:6px 0;min-height:56px}
.nav button svg{font-size:26px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .help{color:var(--out)}
.clock{font-family:var(--display);font-size:52px;font-weight:600;text-align:center;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.date{text-align:center;color:var(--muted)}
.loc{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;font-size:16px}
.loc svg{font-size:24px}
.loc.ok{background:var(--accent-soft);color:var(--accent)}
.loc.bad{background:var(--out-soft);color:var(--out)}
.loc.warn{background:var(--warn-soft);color:var(--warn)}
.big{width:100%;border:0;border-radius:24px;min-height:96px;font-family:var(--display);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:14px}
.big svg{font-size:36px}
.big.go{background:var(--accent);color:var(--accent-ink)}
.big.stop{background:var(--out);color:#fff}
.big.soft{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);font-size:22px;min-height:72px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mid{border:1px solid var(--line);background:var(--surface);border-radius:18px;min-height:64px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px}
.mid svg{font-size:24px}
.card{border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:8px;background:var(--surface)}
.card h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:15px}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.kv b{font-family:var(--display);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.gold span{background:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.bad{background:var(--out-soft);color:var(--out)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.off{background:var(--surface-2);color:var(--muted)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.step{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;text-align:center;padding-block:10px}
.step .icon{font-size:72px;color:var(--accent);margin:0 auto}
.step .icon.bad{color:var(--out)} .step .icon.warn{color:var(--warn)}
.step h2{font-family:var(--display);font-size:28px;margin:0;line-height:1.15;text-wrap:balance}
.step p{margin:0;color:var(--muted);font-size:18px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:99px}
.list{display:grid;gap:10px;text-align:left}
.li{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface)}
.li .ic{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:24px;color:var(--accent);flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:17px}
.li .tx span{color:var(--muted);font-size:14px}
.li.done{opacity:.6}
.li.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.msg{border-left:4px solid var(--info);background:var(--info-soft);border-radius:12px;padding:12px 14px;text-align:left;font-size:16px}
.mic{width:132px;height:132px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:56px;display:grid;place-items:center;margin:0 auto}
.mic.rec{background:var(--out);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.photo{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:18px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:60px;background:var(--surface-2)}
.photo.taken{border-style:solid;border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--info-soft));color:var(--accent)}
.ai{background:var(--gold-soft);border-radius:14px;padding:12px 14px;text-align:left;font-size:15px;display:grid;gap:4px}
.ai b{color:var(--gold);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px}
.stepper button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:36px;font-weight:700}
.stepper output{font-family:var(--display);font-size:56px;font-weight:700;min-width:120px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:12px 18px;font-size:18px;font-weight:700;min-width:64px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.langs{display:grid;gap:10px}
.langs button{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;font-size:20px;font-weight:700;text-align:left}
.langs button span{font-size:28px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4 button{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;font-weight:700;min-height:110px}
.grid4 button svg{font-size:36px}
.sosbtn{width:200px;height:200px;border-radius:50%;border:0;background:var(--out);color:#fff;font-family:var(--display);font-size:26px;font-weight:700;margin:0 auto;display:grid;place-items:center;box-shadow:0 0 0 12px var(--out-soft);position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sosbtn .fill{position:absolute;inset:auto 0 0 0;height:0;background:rgba(0,0,0,.25);transition:height .1s linear}
.sosbtn span{position:relative}
.toast{position:absolute;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:16px;z-index:5}
.overlay{position:absolute;inset:0;background:var(--surface);z-index:6;display:flex;flex-direction:column;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:16px;padding:8px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;width:100%}
.keypad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700}

/* GM dashboard */
.gm{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:grid;gap:16px;font-size:15px}
.gm h1{font-family:var(--display);font-size:26px;margin:0}
.gm .head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.kpi small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.kpi.alert b{color:var(--out)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.colstack{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;display:grid;gap:12px}
.panel h2{font-family:var(--display);font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.briefing{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.briefing ul{margin:0;padding-left:20px;display:grid;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rv{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.rv.bad{border-left-color:var(--out)} .rv.info{border-left-color:var(--info)}
.rv .acts{display:flex;gap:6px;flex-wrap:wrap}
.rv form{display:grid;gap:6px}
.rv input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);width:100%}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.room{border:1px solid var(--line);border-top-width:5px;border-radius:10px;padding:6px 8px;font-size:12px;display:grid;gap:1px}
.room b{font-family:var(--display);font-size:16px}
.room.dirty{border-top-color:var(--out)} .room.prog{border-top-color:var(--warn)} .room.ready{border-top-color:var(--info)} .room.ok{border-top-color:var(--accent)}
.feed{display:grid;gap:10px;max-height:420px;overflow-y:auto}
.fe{display:grid;gap:4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.fe:last-child{border-bottom:0}
.ev{display:flex;gap:6px;flex-wrap:wrap}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface)}
.answer{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.gtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.src{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.src.s{background:var(--warn-soft);color:var(--warn)} .src.g{background:var(--accent-soft);color:var(--accent)} .src.k{background:var(--info-soft);color:var(--info)}
.pf td:first-child{color:var(--muted);width:38%} .pf td{vertical-align:top}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pgrid .panel{align-content:start}
#msgTo,#asTo,#capSel,#asTx{max-width:100%;min-width:0;width:100%;text-overflow:ellipsis}
.panel > div{min-width:0}
@media (max-width:900px){.pgrid{grid-template-columns:minmax(0,1fr)}}

/* Omex black and silver look, every screen */
html.owner{--frame:#07080a}
html.owner body{font-family:Inter,system-ui,sans-serif}
html.owner .demobar,html.owner .sim{color:#d7dbe0;border-color:#1d2126}
html.owner .demobar .tag{background:#2a2e34;color:#e6e9ec}
html.owner .demobar select,html.owner .demobar button,html.owner .sim button{background:#14171b;color:#e6e9ec;border-color:#2e333a}
html.owner .sim [aria-pressed="true"]{background:#e6e9ec;color:#0a0b0d;border-color:#e6e9ec}
html.owner .phone{background:#0d0f12;border-color:#2a2e34;box-shadow:0 0 0 1px #1d2126,0 30px 60px rgba(0,0,0,.6)}
html.owner .big.go{background:linear-gradient(180deg,#f1f3f5,#b9bfc6);color:#0a0b0d;border-color:#c9ced4}
html.owner .big.stop{background:#3a1f19;color:#f6b3a5;border-color:#7a3a2e}
.chak{font:600 12px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.16em;color:#cfd3d8;margin-top:4px;text-align:center}
[hidden]{display:none!important}
.starthere{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));background:#14171b;color:#e6e9ec;border-bottom:1px solid #2e333a;font-size:14px}
.starthere b{font:700 12px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;color:#cfd3d8;margin-right:4px}
.starthere button[data-start]{background:#0a0b0d;color:#e6e9ec;border:1px solid #3a4048;border-radius:999px;padding:7px 12px;font:inherit;cursor:pointer;min-height:36px}
.starthere button[data-start]:hover{border-color:#e6e9ec}
.starthere .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e6e9ec;color:#0a0b0d;font-weight:700;font-size:12px;margin-right:6px}
.starthere .note{flex-basis:100%;color:#9aa1a9;font-size:12.5px}
.starthere .x{margin-left:auto;background:none;border:0;color:#9aa1a9;font-size:18px;cursor:pointer;padding:4px 8px}
</style>

<div class="demobar">
  <span class="tag">CONCEPT DEMO</span><span class="tag" style="background:#9a6200">SAMPLE DATA</span>
  <label for="who" style="font-weight:700">View as</label>
  <select id="who">
    <option value="gm" selected>Owner or GM dashboard</option>
    <option value="fd">Front desk · James</option>
    <option value="hk">Housekeeping · Maria</option>
    <option value="mt">Maintenance · Luis</option>
    <option value="ld">Laundry · Aisha</option>
    <option value="rs">Restaurant server · Tom</option>
    <option value="na">Night audit · Sam</option>
  </select>
  <span class="grow"></span>
  <button id="simtoggle" aria-expanded="false">Try situations</button>
</div>
<div class="starthere" id="starthere">
  <b>START HERE</b>
  <button data-start="home"><span class="n">1</span>Rosa’s suggestions</button>
  <button data-start="ros"><span class="n">2</span>Who’s coming</button>
  <button data-start="rooms"><span class="n">3</span>Room board</button>
  <button class="x" id="shx" aria-label="Hide the start guide">×</button>
  <span class="note">Concept demo by Omex Hospitality with sample data. Not a Hilton product and not connected to any hotel system. Use “View as” to see the app as each staff member.</span>
</div>
<div class="sim" id="sim" hidden>
  <b>Phone location</b>

/* sunset for the hotel's map point, computed for today's date (NOAA approximation) */
function sunTimes(){
  const parts = new Date().toLocaleDateString('en-CA', {timeZone:'America/Chicago'}).split('-').map(Number);
  const y = parts[0], m = parts[1] - 1, d = parts[2];
  const rad = Math.PI/180, lat = HOTEL.lat, lon = HOTEL.lon;
  const doy = Math.round((Date.UTC(y,m,d) - Date.UTC(y,0,0)) / 864e5);
  const g = 2*Math.PI/365*(doy - 1);
  const eqt = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const ha = Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(dec)) - Math.tan(lat*rad)*Math.tan(dec)) / rad;
  const base = Date.UTC(y,m,d);
  return {rise:new Date(base + (720 - 4*(lon + ha) - eqt)*MIN), set:new Date(base + (720 - 4*(lon - ha) - eqt)*MIN)};
}

function softBeep(){ try{ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; const c = softBeep.c || (softBeep.c = new C()); [0, 0.24].forEach(d => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, c.currentTime + d); g.gain.exponentialRampToValueAtTime(0.07, c.currentTime + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + d + 0.18); o.connect(g); g.connect(c.destination); o.start(c.currentTime + d); o.stop(c.currentTime + d + 0.2); }); }catch(e){} }
function roomReady(room, by){
  const r = {room, by, doneAt:now(), rem:1}; S.ready.unshift(r);
  S.feed.push({who:'App', what:`Room ${room} ready alert`, ev:['check'], ai:`Cleaned by ${by}. Sent only to James Carter, who is on the front desk now. Soft beep and vibration.`, at:now()});
  rrRemind(r); return r;
}
function rrRemind(r){
  clearTimeout(RR_T.get(r));
  RR_T.set(r, setTimeout(() => {
    if(r.relAt || r.seenAt) return;
    if(r.rem >= 3){ S.reviews.unshift({id:'rr'+Date.now(), tone:'warn', kind:'ok', title:`Room ${r.room} not released`, body:`Clean since ${tmEn(r.doneAt)} (cleaned by ${r.by}). The front desk got 3 reminders and did not answer.`}); render(); return; }
    r.rem++;
    if(S.view === 'fd' && !S.flow){ vibrate(); softBeep(); S.ovRoom = r; S.ov = 'ready'; render(); }
    rrRemind(r);
  }, 15000));
}

function roomGrid(){

  const who = ['RM','DR'];
  let h = '';
  for(let i = 0; i < 20; i++){ const s = i < 10 ? (i < 6 ? 'ok' : i < 8 ? 'ready' : 'dirty') : (i < 14 ? 'ok' : i < 15 ? 'prog' : 'dirty'); const n = 201 + i; h += `<div class="room ${s}"><b>${n}</b><span>${who[i<10?0:1]} · ${i%2?'stay':'full'}</span></div>`; }
  people.hk.tasks.filter(x => x.key === 'room').forEach(x => { const s = x.done ? 'ready' : x.startAt ? 'prog' : 'dirty'; const iss = S.issues.find(i => i.room === x.room && !i.explained); h += `<div class="room ${iss ? 'dirty' : s}"><b>${x.room}</b><span>MG · ${iss ? 'reported' : x.type}</span></div>`; });

}

let sosTimer = null, sosStart = 0;
function bindSos(){
  const b = document.getElementById('sos'); if(!b) return;
  const fill = document.getElementById('sosfill');
  const down = e => { e.preventDefault(); sosStart = Date.now(); clearInterval(sosTimer); sosTimer = setInterval(() => { const k = Math.min(1, (Date.now() - sosStart)/1500); fill.style.height = (k*100) + '%'; if(k >= 1){ clearInterval(sosTimer); sosFire(); } }, 40); };
  const up = () => { clearInterval(sosTimer); fill.style.height = '0'; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
  b.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') sosFire(); });
}
function sosFire(){
  vibrate(); const p = me();
  S.reviews.unshift({id:'sos'+Date.now(), tone:'bad', kind:'sos', title:`EMERGENCY from ${p.name}`, body:`Pressed at ${tmEn(now())}. Last known place: at the hotel, ${p.dept === 'na' ? 'front desk' : 'service area'}. The owner was also notified.`});
  S.ov = 'sos'; render();
}

const CAPS = {w40:'No overtime: max 40 h each week', p80:'Max 80 h per 2-week pay period', p40:'Max 40 h per 2-week pay period (part-time)'};
function weekCap(r){ const c = S.sched.cap; return c === 'w40' ? 40 : c === 'p80' ? Math.min(60, 80 - r.last) : Math.max(0, 40 - r.last); }
function draftWeek(){
  const plan = {}, hrs = {}, gaps = [];
  ROSTER.forEach(r => { plan[r.name] = Array(7).fill(null); hrs[r.name] = 0; });
  for(let day = 0; day < 7; day++) for(const [k, s] of Object.entries(SH)){
    let need = s.min[day];
    const pick = cross => ROSTER.filter(r => (cross ? (S.sched.useCross && r.cross.includes(s.d)) : r.d === s.d) && !r.off.includes(day) && !plan[r.name][day] && plan[r.name].filter(Boolean).length < 5 && hrs[r.name] + s.h <= weekCap(r)).sort((a, b) => hrs[a.name] - hrs[b.name]);
    for(const cross of [false, true]){ for(const r of pick(cross)){ if(need <= 0) break; plan[r.name][day] = k + (cross ? '*' : ''); hrs[r.name] += s.h; need--; } }
    if(need > 0) gaps.push({day, k, need});
  }
  return {plan, hrs, gaps};
}

  if(lang === 'es') return `${L} · ${date}\n\nHola ${n.first}:\n\n${n.es}\n\nLo que esperamos: ${n.expEs}\n\nEsta es tu nota número ${n.level} en 90 días. ${n.level < 3 ? 'Si vuelve a pasar, el siguiente paso es: ' + LEVELS[n.level + 1][1].toLowerCase() + '.' : 'El siguiente paso puede ser la terminación del empleo.'} Puedes explicar lo que pasó en la app; Shelby lo leerá.\n\nShelby, Gerente General`;
  return `${L} · ${date}\n\nHi ${n.first},\n\n${n.en}\n\nWhat we expect: ${n.expEn}\n\nThis is note ${n.level} in the last 90 days. ${n.level < 3 ? 'If it happens again, the next step is a ' + LEVELS[n.level + 1][0].toLowerCase() + '.' : 'The next step may be termination of employment.'} You can explain what happened in the app; Shelby will read it.\n\nShelby, General Manager`;
}
function addNotice(o){
  const prev = S.hr.notices.filter(x => x.name === o.name).length;
  const n = Object.assign({id:'hr' + Date.now() + Math.random().toString(36).slice(2,5), at:now(), level:Math.min(3, prev + 1)}, o);
  n.status = S.hr.mode === 'auto' ? 'sent' : 'draft';
  S.hr.notices.unshift(n);
  if(n.status === 'draft') S.reviews.unshift({id:'rv' + n.id, tone:'warn', kind:'hr', hr:n.id, title:`HR notice drafted for ${n.name}: ${LEVELS[n.level][0].toLowerCase()}`, body:`${n.en} Will be sent in ${LANG_NAME[n.lang]} once you approve.`});
  else S.feed.push({who:'App', what:`${LEVELS[n.level][0]} sent to ${n.name}`, ev:['check'], ai:`${n.en} Sent automatically in ${LANG_NAME[n.lang]} with read-aloud. Waiting for the employee to acknowledge.`, at:now()});
  return n;
}

.gauge{background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:6px;border-radius:18px}
.gauge:hover{background:#101215}
.gauge svg{width:min(100%,300px);height:auto}
.gauge b{font-size:24px;font-weight:600;letter-spacing:-.01em}
.gauge small{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;color:#8a9098}
.gauge.alert b{color:#f08a74}
.ov .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:100%;max-width:900px;margin-top:22px}

.ov .menu button:hover{border-color:#8a9098}
.gmtop{display:flex;align-items:center;gap:12px}

function gaugeSvg(v){
  const cx = 100, cy = 100, r = 82, A0 = 135, SW = 270, MAX = 120, ang = x => (A0 + SW*Math.min(MAX, Math.max(0, x))/MAX)*Math.PI/180, pt = (a, rr) => [cx + rr*Math.cos(a), cy + rr*Math.sin(a)];
  const arc = (a1, a2, rr) => { const [x1, y1] = pt(a1, rr), [x2, y2] = pt(a2, rr); return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${rr} ${rr} 0 ${a2 - a1 > Math.PI ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
  let ticks = ''; for(let i = 0; i <= 24; i++){ const a = ang(i*5), major = i % 4 === 0, [x1, y1] = pt(a, r - 6), [x2, y2] = pt(a, r - (major ? 16 : 10)); ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${major ? '#c9cdd2' : '#4a4f56'}" stroke-width="${major ? 1.6 : 1}"/>`; }
  const a = ang(v), [nx, ny] = pt(a, r*.74), [tx, ty] = pt(a + Math.PI, 12), [dx, dy] = pt(ang(100), r + 8);
  return `<svg viewBox="0 0 200 178" role="img" aria-label="${Math.round(v)} percent"><defs><linearGradient id="silver" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7c838b"/><stop offset=".6" stop-color="#e9ecef"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
  <path d="${arc(ang(0), ang(MAX), r)}" fill="none" stroke="#24282e" stroke-width="1.6"/>
  <path d="${arc(ang(0), Math.max(ang(0.5), a), r)}" fill="none" stroke="url(#silver)" stroke-width="2.4" stroke-linecap="round"/>
  ${ticks}<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="1.8" fill="#d7dbe0"/>
  <line x1="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#f2f4f6" stroke-width="2.2" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#0a0b0d" stroke="#f2f4f6" stroke-width="2"/>
  <text x="${cx}" y="152" text-anchor="middle" fill="#f2f4f6" font-family="Inter,system-ui,sans-serif" font-weight="300" font-size="34">${Math.round(v)}<tspan font-size="12" fill="#8a9098" dx="2">%</tspan></text></svg>`;
}
